name: Release

# Publishes a release that the plugin's Updater picks up on the WordPress Plugins screen.
#  - Push a tag like v0.2.0, or
#  - run this workflow by hand (Actions → Release → Run workflow) and enter the tag; GitHub
#    creates the tag on the chosen branch for you.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (must match the plugin Version)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must be vX.Y.Z and match the plugin version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like v1.2.3" >&2
            exit 1
          fi
          version=$(sed -nE 's/^ \* Version:[[:space:]]*([0-9][^[:space:]]*).*/\1/p' sprint-booking.php | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match plugin version $version" >&2
            exit 1
          fi

      - name: Build (lint, tests, zip)
        run: bin/build-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/sprint-booking.zip \
            --target "$GITHUB_SHA" \
            --title "Sprint Booking ${TAG#v}" \
            --generate-notes
